spring.application.name=event-registration

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/event_registration_portal
spring.datasource.username=root
spring.datasource.password=MYPASSWORD


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8084
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT Configuration (Must match Auth Service exactly)
sgsits.app.jwtSecret=sgsitsPortalSecretKeyForAuthenticationServiceShouldBeLongEnoughAndSecureAndSecretKeyForB64Encoding12345
sgsits.app.jwtExpirationMs=86400000
